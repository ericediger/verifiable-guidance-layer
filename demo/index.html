<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verifiable Guidance Layer</title>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="/demo/styles.css">
</head>
<body>
<header class="top">
  <div class="wrap top-row">
    <div class="brand">
      <h1>Verifiable Guidance Layer</h1>
      <p class="descriptor">Answers about the GSB Standards, resolved for a place and a date, checked before you see them.</p>
    </div>
    <div class="release-badge" id="release-badge" aria-live="polite">Loading…</div>
  </div>
  <nav class="wrap" aria-label="Sections">
    <div class="segmented" role="tablist">
      <button role="tab" data-tab="ask" aria-selected="true">Ask</button>
      <button role="tab" data-tab="compare" aria-selected="false">Compare</button>
      <button role="tab" data-tab="releases" aria-selected="false">Releases</button>
      <button role="tab" data-tab="issued" aria-selected="false">Issued answers</button>
    </div>
  </nav>
</header>

<main class="wrap">
  <section id="tab-ask" class="tab" data-tab="ask"></section>
  <section id="tab-compare" class="tab" data-tab="compare" hidden></section>
  <section id="tab-releases" class="tab" data-tab="releases" hidden></section>
  <section id="tab-issued" class="tab" data-tab="issued" hidden></section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="/demo/app.js"></script>
</body>
</html>
