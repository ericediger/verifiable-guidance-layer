rationale: >-
  Guidance Statement GS-2025-02 refers firms to QA-2025-031 for the treatment of
  portfolios that fall below a composite minimum solely because of a significant cash
  flow. The layer currently returns REVIEW on that question because it does not hold
  the Q&A. The Q&A was published on 15 April 2025 and carves out an exception to 3.A.7.

