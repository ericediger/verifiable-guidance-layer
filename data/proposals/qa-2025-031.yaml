  nodes:
    - concept_id: ruling:QA-2025-031
      version_id: ruling:QA-2025-031@v1
      display_ref: QA-2025-031
      source_doc: doc:QA-2025-031
      effective_from: 2025-04-15
      tier: interpretive
      obligation: n/a
      parameters: {grace_period_months: 3}
      text: >-
        Question: Must a portfolio be removed from a composite when it falls below the
        composite minimum solely because of a significant cash flow? Answer: No. Where the
        breach results solely from a significant cash flow, as defined in the firm's
        documented policy for the composite, the portfolio may remain in the composite for
        up to three full measurement periods following the cash flow, provided that the
        firm's documented composite policy provides for this treatment and the
        determination is documented at the time it is made. If the portfolio remains below
        the minimum at the end of that period, it must be removed. This treatment is
        available only where the cause of the breach is a significant cash flow. A
        portfolio that falls below the minimum through market movement or through a
        series of cash flows that do not individually meet the firm's significant cash
        flow threshold must be removed in accordance with 3.A.7.

