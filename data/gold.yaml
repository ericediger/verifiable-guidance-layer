# The gold set — the specification of correct behaviour, as data.
#
# Each case names a question, the controls (jurisdiction, as-of, release), and what a
# correct verified answer must and must not do. The evals (tests/eval) run every case
# through the layer and through the naive baseline. The editor's impact preview
# re-resolves every case against a proposed change before it is published.
#
# "answered" means outcome is ANSWER or ANSWER_WITH_FLAGS. Soft flags (an independent
# judge's doubt) do not change whether a case counts as answered; hard flags are
# asserted by name.

- id: G1
  name: Stale clause
  trap: stale
  question: By when must a new portfolio be added to a composite?
  jurisdiction: JN
  as_of: 2025-06-01
  release: 1
  entry_concepts: [prov:composite-inclusion-timing]
  expect:
    answered: true
    must_cite: [prov:composite-inclusion-timing@E2025]
    must_not_cite: [prov:composite-inclusion-timing@E2021]
    forbidden_flags: [unresolved_reference, pending_adoption]
    summary_contains_any: ["first full calendar month", "first full month"]
  naive:
    failure_if_cites_any: [prov:composite-inclusion-timing@E2021]
    failure_if_answer_contains_any: ["second full"]

- id: G2
  name: Jurisdiction branch
  trap: jurisdiction
  question: By when must a new portfolio be added to a composite?
  jurisdiction: JS
  as_of: 2025-06-01
  release: 1
  entry_concepts: [prov:composite-inclusion-timing]
  expect:
    answered: true
    must_cite: [prov:composite-inclusion-timing@E2021]
    must_not_cite: [prov:composite-inclusion-timing@E2025, note:PN-001@v1]
    required_flags: [pending_adoption, practitioner_note]
    summary_contains_any: ["second full calendar month", "second full month"]
  naive:
    failure_if_cites_any: [prov:composite-inclusion-timing@E2025]
    failure_if_answer_contains_any: ["first full"]
    note: the baseline has no concept of jurisdiction; it answers for the wrong place

- id: G3
  name: Cross-standard interaction (definition changed, provision did not)
  trap: interaction
  question: A client bars us from buying tobacco stocks; the portfolio otherwise follows the strategy. Must it be in a composite?
  jurisdiction: JN
  as_of: 2025-06-01
  release: 1
  entry_concepts: [prov:composite-inclusion-all-discretionary, def:discretionary-portfolio]
  expect:
    answered: true
    conclusion_in: [yes, depends]
    must_cite: [def:discretionary-portfolio@E2025]
    must_not_cite: [def:discretionary-portfolio@E2021]
    forbidden_flags: [unresolved_reference]
  naive:
    failure_if_cites_any: [def:discretionary-portfolio@E2021]
    failure_if_conclusion_in: [no]
    note: the old definition made any client restriction non-discretionary

- id: G4a
  name: Unknown carve-out — Release 1 (reference not held)
  trap: carve_out
  question: A client withdrew 40% last month and the portfolio is now below our composite minimum. Must we remove it?
  jurisdiction: JN
  as_of: 2025-06-01
  release: 1
  entry_concepts: [prov:composite-minimum]
  expect:
    outcome: REVIEW
    required_flags: [unresolved_reference]
    must_cite: [prov:composite-minimum@E2025]
    gap_concepts: [ruling:QA-2025-031]
  naive:
    failure_if_conclusion_in: [yes]
    note: the baseline says "remove it" with confidence; it does not know what it does not hold

- id: G4b
  name: Unknown carve-out — Release 2 (ruling ingested)
  trap: carve_out
  question: A client withdrew 40% last month and the portfolio is now below our composite minimum. Must we remove it?
  jurisdiction: JN
  as_of: 2025-06-01
  release: 2
  requires_proposal: prop:QA-2025-031
  entry_concepts: [prov:composite-minimum]
  expect:
    answered: true
    conclusion_in: [no, depends]
    required_flags: [carve_out]
    forbidden_flags: [unresolved_reference]
    must_cite: [ruling:QA-2025-031@v1]
    summary_contains_any: ["three", "3 "]
  naive:
    failure_if_conclusion_in: [yes]

- id: G5
  name: No coverage
  trap: coverage
  question: How are staking rewards on digital assets treated in composite returns?
  jurisdiction: JN
  as_of: 2025-06-01
  release: 1
  entry_concepts: []
  expect:
    outcome: REVIEW
    max_claims: 1
  naive:
    failure_if_conclusion_in: [yes, no, depends]
    note: the baseline fabricates an answer from whatever passages it found

- id: G6
  name: Clarify — specific case, no facts
  trap: clarify
  question: Does this portfolio need to be in a composite?
  jurisdiction: JN
  as_of: 2025-06-01
  release: 1
  entry_concepts: [prov:composite-inclusion-all-discretionary]
  expect:
    outcome: CLARIFY
    clarifications_mention_any: [discretionary, fee-paying]
  naive:
    failure_if_conclusion_in: [yes, no]
