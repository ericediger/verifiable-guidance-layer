# ─── Practitioner layer ─────────────────────────────────────────────────────────

- concept_id: note:PN-001
  kind: practice_note
  title: Practice Note PN-001 — Inclusion-timing policy wording in Jurisdiction South
  versions:
    - {version_id: note:PN-001@v1, display_ref: PN-001, source_doc: doc:PN-001, effective_from: 2025-05-20, tier: practitioner, obligation: n/a, jurisdiction_scope: JS,
