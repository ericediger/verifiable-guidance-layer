- id: ia:IA-0001
  client_name: Harbor Point Advisors
  client_ref: HPA-77
  issued_on: 2025-03-10
  jurisdiction: JN
  as_of: 2025-03-10
  release_id: 1
  question: "Are employee accounts with fully waived management fees fee-paying portfolios that must be included in a composite?"
  outcome: ANSWER
  answer_text: >-
    Yes. Under 1.D.6 (Edition 2025) a portfolio is fee-paying when it is subject to the
    firm's fee schedule, whether or not the fee is reduced or waived in whole or in part,
    so fully fee-waived employee accounts are fee-paying portfolios, and 3.A.1 requires
    that all actual, fee-paying, discretionary portfolios be included in at least one
    composite.
  cited_versions:
    - prov:composite-inclusion-all-discretionary@E2025
    - def:fee-paying-portfolio@E2025
