[project]
name = "vgl"
version = "0.1.0"
description = "Verifiable Guidance Layer — a verifiable regulatory knowledge layer (proof of concept)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "anthropic>=0.40",
    "openai>=1.50",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: deterministic tests with exact expectations (no LLM)",
    "eval: gold-set evaluations of probabilistic stages (replay by default)",
    "baseline: evidence tests that document naive-RAG failures",
]
